<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="34" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">CoNNECT NPC: how a job is submitted and executed</text>

  <!-- Jumpbox -->
  <rect x="20" y="150" width="170" height="96" rx="6" fill="#e3ecf7" stroke="#3a6ea5" stroke-width="2"/>
  <text x="105" y="178" font-size="15" font-weight="bold" fill="#1d3f66" text-anchor="middle">Jumpbox</text>
  <text x="105" y="198" font-size="12" fill="#1d3f66" text-anchor="middle">User VM</text>
  <text x="105" y="222" font-size="11" fill="#1d3f66" text-anchor="middle">SSH / RDP to nodes</text>

  <!-- Master node -->
  <rect x="240" y="60" width="380" height="490" rx="8" fill="#fbe3cc" stroke="#d9730d" stroke-width="2"/>
  <text x="430" y="88" font-size="17" font-weight="bold" fill="#7a3d00" text-anchor="middle">Submit node</text>

  <rect x="260" y="122" width="340" height="62" rx="6" fill="#fff" stroke="#d9730d"/>
  <text x="430" y="145" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">Condor job submitted</text>
  <text x="430" y="164" font-size="11" fill="#333" text-anchor="middle">pycondor-configured submit files</text>
  <text x="430" y="178" font-size="11" fill="#333" text-anchor="middle">or manual HTCondor submission</text>

  <rect x="260" y="206" width="340" height="62" rx="6" fill="#fff" stroke="#d9730d"/>
  <text x="430" y="229" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">condor_schedd  (job queue)</text>
  <text x="430" y="248" font-size="11" fill="#333" text-anchor="middle">jobs wait in the queue as idle; for pycondor</text>
  <text x="430" y="262" font-size="11" fill="#333" text-anchor="middle">DAGs, DAGMan releases them in dependency order</text>

  <rect x="260" y="290" width="160" height="70" rx="6" fill="#fff" stroke="#d9730d"/>
  <text x="340" y="314" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">condor_negotiator</text>
  <text x="340" y="332" font-size="11" fill="#333" text-anchor="middle">matchmaking: job</text>
  <text x="340" y="346" font-size="11" fill="#333" text-anchor="middle">requirements ↔ free slots</text>

  <rect x="440" y="290" width="160" height="70" rx="6" fill="#fff" stroke="#d9730d"/>
  <text x="520" y="314" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">condor_collector</text>
  <text x="520" y="332" font-size="11" fill="#333" text-anchor="middle">pool database of</text>
  <text x="520" y="346" font-size="11" fill="#333" text-anchor="middle">machine + job ClassAds</text>

  <rect x="260" y="382" width="340" height="56" rx="6" fill="#fff" stroke="#d9730d"/>
  <text x="430" y="405" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">condor_shadow  (one per running job)</text>
  <text x="430" y="424" font-size="11" fill="#333" text-anchor="middle">represents the job on the submit side; writes the job log</text>


  <!-- internal arrows on master -->
  <line x1="430" y1="184" x2="430" y2="203" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="268" x2="340" y2="287" stroke="#333" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="420" y1="325" x2="437" y2="325" stroke="#333" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Core nodes (stack indicates N nodes) -->
  <rect x="756" y="48" width="420" height="502" rx="8" fill="#eef4fb" stroke="#7a95b8" stroke-width="1.5"/>
  <rect x="748" y="54" width="420" height="502" rx="8" fill="#eef4fb" stroke="#7a95b8" stroke-width="1.5"/>
  <rect x="740" y="60" width="420" height="490" rx="8" fill="#dde9f6" stroke="#2f5d8a" stroke-width="2"/>
  <text x="950" y="88" font-size="17" font-weight="bold" fill="#1d3f66" text-anchor="middle">Core node(s)</text>
  <text x="950" y="106" font-size="12" fill="#1d3f66" text-anchor="middle">HTCondor execute nodes (CPU and GPU); can also submit jobs</text>
  <text x="950" y="150" font-size="12" fill="#1d3f66" text-anchor="middle">Ubuntu 24.04 with Docker installed</text>

  <rect x="760" y="206" width="380" height="62" rx="6" fill="#fff" stroke="#2f5d8a"/>
  <text x="950" y="229" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">condor_startd</text>
  <text x="950" y="248" font-size="11" fill="#333" text-anchor="middle">divides the node into slots (CPUs, memory, GPUs)</text>
  <text x="950" y="262" font-size="11" fill="#333" text-anchor="middle">and advertises them to the collector</text>

  <rect x="760" y="290" width="380" height="70" rx="6" fill="#fff" stroke="#2f5d8a"/>
  <text x="950" y="314" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">condor_starter  (one per job)</text>
  <text x="950" y="338" font-size="11" fill="#333" text-anchor="middle">sets up the job environment</text>

  <rect x="760" y="376" width="185" height="62" rx="6" fill="#fff" stroke="#2f5d8a"/>
  <text x="852" y="396" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">Docker universe</text>
  <text x="852" y="414" font-size="11" fill="#333" text-anchor="middle">Docker Engine pulls the image</text>
  <text x="852" y="428" font-size="11" fill="#333" text-anchor="middle">and starts a container</text>

  <rect x="955" y="376" width="185" height="62" rx="6" fill="#fff" stroke="#2f5d8a"/>
  <text x="1047" y="396" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">Vanilla universe</text>
  <text x="1047" y="414" font-size="11" fill="#333" text-anchor="middle">runs directly on the node</text>
  <text x="1047" y="428" font-size="11" fill="#333" text-anchor="middle">(e.g., Python or bash script)</text>

  <!-- container -->
  <rect x="790" y="462" width="320" height="76" rx="6" fill="#d6ead0" stroke="#3d7a2b" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="950" y="484" font-size="13" font-weight="bold" fill="#1f4d12" text-anchor="middle">Job execution</text>
  <text x="950" y="502" font-size="11" fill="#1f4d12" text-anchor="middle">runs the processing command with the</text>
  <text x="950" y="516" font-size="11" fill="#1f4d12" text-anchor="middle">requested CPUs and memory; project storage</text>
  <text x="950" y="530" font-size="11" fill="#1f4d12" text-anchor="middle">is mounted on the node (bind-mounted for Docker)</text>

  <!-- internal arrows on core node -->
  <line x1="852" y1="360" x2="852" y2="373" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1047" y1="360" x2="1047" y2="373" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="852" y1="438" x2="852" y2="459" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1047" y1="438" x2="1047" y2="459" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="950" y="372" font-size="10" fill="#333" text-anchor="middle">or</text>

  <!-- Storage -->
  <rect x="240" y="610" width="920" height="64" rx="8" fill="#d6ead0" stroke="#3d7a2b" stroke-width="2"/>
  <text x="700" y="638" font-size="16" font-weight="bold" fill="#1f4d12" text-anchor="middle">Centralized Storage</text>
  <text x="700" y="658" font-size="12" fill="#1f4d12" text-anchor="middle">Enterprise-level storage with daily backups · mounted on every node</text>
  <line x1="430" y1="550" x2="430" y2="606" stroke="#3d7a2b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="950" y1="538" x2="950" y2="606" stroke="#3d7a2b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="960" y="585" font-size="11" fill="#1f4d12">read inputs / write outputs</text>

  <!-- Cross-node arrows -->
  <!-- 1 submit -->
  <line x1="190" y1="175" x2="257" y2="153" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 2 advertise: startd -> collector -->
  <path d="M760,252 L690,252 L690,325 L603,325" fill="none" stroke="#2f5d8a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <!-- 4 claim: schedd -> startd -->
  <line x1="600" y1="222" x2="757" y2="222" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 5 shadow <-> starter -->
  <line x1="600" y1="410" x2="757" y2="335" stroke="#333" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- step badges -->
  <g font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">
    <circle cx="214" cy="148" r="11" fill="#c0392b"/><text x="214" y="152">1</text>
    <circle cx="430" cy="194" r="11" fill="#c0392b"/><text x="430" y="198">2</text>
    <circle cx="705" cy="285" r="11" fill="#c0392b"/><text x="705" y="289">3</text>
    <circle cx="320" cy="278" r="11" fill="#c0392b"/><text x="320" y="282">4</text>
    <circle cx="678" cy="210" r="11" fill="#c0392b"/><text x="678" y="214">5</text>
    <circle cx="678" cy="398" r="11" fill="#c0392b"/><text x="678" y="402">6</text>
    <circle cx="950" cy="450" r="10" fill="#c0392b"/><text x="950" y="454">7</text>
    <circle cx="940" cy="572" r="11" fill="#c0392b"/><text x="940" y="576">8</text>
  </g>

  <!-- Legend -->
  <g font-size="11.5" fill="#333">
    <text x="20" y="300" font-weight="bold" font-size="13">Job lifecycle</text>
    <text x="20" y="320">1  Job is submitted (pycondor</text>
    <text x="34" y="334">or manual condor_submit)</text>
    <text x="20" y="352">2  Jobs are queued</text>
    <text x="34" y="366">in condor_schedd</text>
    <text x="20" y="384">3  Core nodes advertise</text>
    <text x="34" y="398">free slots</text>
    <text x="20" y="416">4  Negotiator matches a</text>
    <text x="34" y="430">job to a slot</text>
    <text x="20" y="448">5  Schedd claims the slot</text>
    <text x="20" y="466">6  Shadow ↔ starter run</text>
    <text x="34" y="480">and monitor the job</text>
    <text x="20" y="498">7  Starter runs the job in a</text>
    <text x="34" y="512">Docker container or</text>
    <text x="34" y="526">directly on the node</text>
    <text x="20" y="544">8  Job reads/writes</text>
    <text x="34" y="558">project data; exit code</text>
    <text x="34" y="572">and logs return to the log</text>
  </g>
</svg>
