<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1000" height="460" fill="#ffffff"/>

  <!-- Isolated network boundary -->
  <rect x="20" y="20" width="960" height="330" rx="8" fill="none" stroke="#1a9e9e" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="40" y="44" font-size="14" font-weight="bold" fill="#1a7a7a">CoNNECT isolated network</text>

  <!-- MRI -->
  <rect x="45" y="110" width="210" height="170" rx="8" fill="#dfe3a6" stroke="#5f7d1f" stroke-width="2"/>
  <text x="150" y="145" font-size="17" font-weight="bold" fill="#2f4a0a" text-anchor="middle">MRI Scanner</text>
  <text x="150" y="175" font-size="14" fill="#2f4a0a" text-anchor="middle">Philips Ingenia Cx 3T</text>
  <text x="150" y="215" font-size="13" fill="#2f4a0a" text-anchor="middle">Acquires images in</text>
  <text x="150" y="233" font-size="13" fill="#2f4a0a" text-anchor="middle">DICOM format</text>

  <!-- NPC -->
  <rect x="345" y="70" width="300" height="250" rx="8" fill="#fbe3cc" stroke="#d9730d" stroke-width="2"/>
  <text x="495" y="100" font-size="17" font-weight="bold" fill="#7a3d00" text-anchor="middle">Neuro-Processing Cluster (NPC)</text>

  <rect x="365" y="118" width="260" height="58" rx="6" fill="#ffffff" stroke="#d9730d"/>
  <text x="495" y="142" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Master node</text>
  <text x="495" y="162" font-size="12" fill="#333" text-anchor="middle">Orthanc PACS · MySQL · HTCondor manager</text>

  <rect x="365" y="186" width="260" height="58" rx="6" fill="#ffffff" stroke="#d9730d"/>
  <text x="495" y="210" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Core node(s)</text>
  <text x="495" y="230" font-size="12" fill="#333" text-anchor="middle">HTCondor jobs · Docker containers</text>

  <rect x="365" y="254" width="260" height="52" rx="6" fill="#ffffff" stroke="#d9730d"/>
  <text x="495" y="276" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Jumpbox (user VM)</text>
  <text x="495" y="294" font-size="12" fill="#333" text-anchor="middle">SSH access to the cluster</text>

  <!-- Storage -->
  <rect x="735" y="110" width="220" height="170" rx="8" fill="#d6ead0" stroke="#3d7a2b" stroke-width="2"/>
  <text x="845" y="140" font-size="17" font-weight="bold" fill="#1f4d12" text-anchor="middle">Centralized Storage</text>
  <text x="845" y="164" font-size="13" fill="#1f4d12" text-anchor="middle">/resshare (backed up daily)</text>
  <text x="845" y="196" font-size="13" fill="#1f4d12" text-anchor="middle">Per-project BIDS directories:</text>
  <text x="845" y="218" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f4d12" text-anchor="middle">sourcedata/</text>
  <text x="845" y="238" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f4d12" text-anchor="middle">rawdata/</text>
  <text x="845" y="258" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f4d12" text-anchor="middle">derivatives/</text>

  <!-- MRI -> NPC -->
  <line x1="257" y1="160" x2="361" y2="147" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="138" font-size="12" fill="#333" text-anchor="middle">DICOM push</text>

  <!-- NPC <-> Storage -->
  <line x1="649" y1="195" x2="731" y2="195" stroke="#333" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="690" y="185" font-size="12" fill="#333" text-anchor="middle">read / write</text>
  <text x="690" y="215" font-size="12" fill="#333" text-anchor="middle">project data</text>

  <!-- User -> Jumpbox -->
  <circle cx="495" cy="392" r="11" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M475,430 a20,18 0 0 1 40,0" fill="none" stroke="#333" stroke-width="2"/>
  <text x="495" y="450" font-size="13" fill="#333" text-anchor="middle">User</text>
  <line x1="495" y1="378" x2="495" y2="311" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="505" y="375" font-size="12" fill="#333">VMware Horizon (WSU network or VPN)</text>
</svg>
