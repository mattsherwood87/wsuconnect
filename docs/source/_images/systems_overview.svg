<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1000" height="500" fill="#ffffff"/>

  <!-- Isolated network boundary -->
  <rect x="20" y="20" width="960" height="375" rx="8" fill="none" stroke="#1a9e9e" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="40" y="44" font-size="14" font-weight="bold" fill="#1a7a7a">CoNNECT isolated network</text>

  <!-- MRI -->
  <rect x="40" y="100" width="180" height="170" rx="8" fill="#dfe3a6" stroke="#5f7d1f" stroke-width="2"/>
  <text x="130" y="135" font-size="17" font-weight="bold" fill="#2f4a0a" text-anchor="middle">MRI Scanner</text>
  <text x="130" y="165" font-size="14" fill="#2f4a0a" text-anchor="middle">Philips Ingenia Cx 3T</text>
  <text x="130" y="205" font-size="13" fill="#2f4a0a" text-anchor="middle">Acquires images in</text>
  <text x="130" y="223" font-size="13" fill="#2f4a0a" text-anchor="middle">DICOM format</text>

  <!-- NPC -->
  <rect x="345" y="60" width="300" height="240" rx="8" fill="#fbe3cc" stroke="#d9730d" stroke-width="2"/>
  <text x="495" y="88" font-size="17" font-weight="bold" fill="#7a3d00" text-anchor="middle">Neuro-Processing Cluster (NPC)</text>

  <rect x="365" y="102" width="260" height="52" rx="6" fill="#ffffff" stroke="#d9730d"/>
  <text x="495" y="124" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Master node</text>
  <text x="495" y="143" font-size="12" fill="#333" text-anchor="middle">HTCondor manager</text>

  <rect x="365" y="164" width="260" height="52" rx="6" fill="#ffffff" stroke="#d9730d"/>
  <text x="495" y="186" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Transfer and execute node</text>
  <text x="495" y="205" font-size="12" fill="#333" text-anchor="middle">Orthanc PACS · MySQL · HTCondor jobs</text>

  <rect x="365" y="226" width="260" height="52" rx="6" fill="#ffffff" stroke="#d9730d"/>
  <text x="495" y="248" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Core node(s)</text>
  <text x="495" y="267" font-size="12" fill="#333" text-anchor="middle">HTCondor jobs · Docker containers</text>

  <!-- Jumpbox (outside the NPC) -->
  <rect x="395" y="322" width="200" height="52" rx="6" fill="#e3ecf7" stroke="#3a6ea5" stroke-width="2"/>
  <text x="495" y="344" font-size="14" font-weight="bold" fill="#1d3f66" text-anchor="middle">Jumpbox (user VM)</text>
  <text x="495" y="362" font-size="12" fill="#1d3f66" text-anchor="middle">Windows or Linux</text>
  <line x1="495" y1="322" x2="495" y2="304" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="505" y="316" font-size="12" fill="#333">SSH / RDP to nodes</text>

  <!-- Storage -->
  <rect x="735" y="100" width="220" height="170" rx="8" fill="#d6ead0" stroke="#3d7a2b" stroke-width="2"/>
  <text x="845" y="170" font-size="17" font-weight="bold" fill="#1f4d12" text-anchor="middle">Centralized Storage</text>
  <text x="845" y="196" font-size="13" fill="#1f4d12" text-anchor="middle">Enterprise-level storage</text>
  <text x="845" y="214" font-size="13" fill="#1f4d12" text-anchor="middle">with daily backups</text>

  <!-- MRI isolated network switch: MRI <-> switch <-> master node and transfer and execute node -->
  <rect x="240" y="126" width="90" height="58" rx="6" fill="#e6dcf2" stroke="#6b4c9a" stroke-width="2"/>
  <text x="285" y="145" font-size="11" font-weight="bold" fill="#3f2a63" text-anchor="middle">MRI isolated</text>
  <text x="285" y="159" font-size="11" font-weight="bold" fill="#3f2a63" text-anchor="middle">network</text>
  <text x="285" y="173" font-size="11" font-weight="bold" fill="#3f2a63" text-anchor="middle">switch</text>
  <line x1="220" y1="155" x2="240" y2="155" stroke="#6b4c9a" stroke-width="2"/>
  <line x1="330" y1="140" x2="361" y2="128" stroke="#6b4c9a" stroke-width="2"/>
  <line x1="330" y1="170" x2="361" y2="188" stroke="#6b4c9a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="285" y="204" font-size="12" fill="#333" text-anchor="middle">DICOM push</text>
  <text x="285" y="219" font-size="11" fill="#333" text-anchor="middle">to Orthanc PACS</text>

  <!-- NPC <-> Storage -->
  <line x1="649" y1="185" x2="731" y2="185" stroke="#333" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="690" y="175" font-size="12" fill="#333" text-anchor="middle">read / write</text>
  <text x="690" y="205" font-size="12" fill="#333" text-anchor="middle">project data</text>

  <!-- User -> Jumpbox -->
  <circle cx="495" cy="432" r="11" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M475,470 a20,18 0 0 1 40,0" fill="none" stroke="#333" stroke-width="2"/>
  <text x="495" y="490" font-size="13" fill="#333" text-anchor="middle">User</text>
  <line x1="495" y1="418" x2="495" y2="378" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
